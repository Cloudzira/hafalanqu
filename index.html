<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Spreadsheet Saya</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f6f8;
    }
    h2 {
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 12px;
      border: 1px solid #ddd;
      text-align: left;
    }
    th {
      background-color: #4CAF50;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    #loading {
      font-weight: bold;
      color: #666;
    }
  </style>
</head>
<body>

  <h2>Data dari Google Sheets</h2>
  <div id="loading">Memuat data...</div>
  
  <table id="dataTable" style="display: none;">
    <thead id="tableHeader"></thead>
    <tbody id="tableBody"></tbody>
  </table>

  <script>
    // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbydyZfNnax2D-uRxzfcTYorKUHtlRgkmbhg8Z10pVKjcig6T-ctQEM4KfIyzkD6FZYg/exec";

    async function fetchData() {
      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();

        if (data.length > 0) {
          // Sembunyikan teks loading dan tampilkan tabel
          document.getElementById('loading').style.display = 'none';
          document.getElementById('dataTable').style.display = 'table';

          // Baris pertama dijadikan Header Tabel (th)
          const headerRow = data[0];
          const thead = document.getElementById('tableHeader');
          let headerHTML = '<tr>';
          headerRow.forEach(header => {
            headerHTML += `<th>${header}</th>`;
          });
          headerHTML += '</tr>';
          thead.innerHTML = headerHTML;

          // Baris sisa dijadikan Isi Tabel (td)
          const tbody = document.getElementById('tableBody');
          let bodyHTML = '';
          for (let i = 1; i < data.length; i++) {
            bodyHTML += '<tr>';
            data[i].forEach(cell => {
              bodyHTML += `<td>${cell}</td>`;
            });
            bodyHTML += '</tr>';
          }
          tbody.innerHTML = bodyHTML;
        } else {
          document.getElementById('loading').innerText = 'Data kosong.';
        }
      } catch (error) {
        console.error('Error fetching data:', error);
        document.getElementById('loading').innerText = 'Gagal memuat data.';
      }
    }

    // Jalankan fungsi saat halaman dimuat
    fetchData();
  </script>
</body>
</html>
