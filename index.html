<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Hafalan Qur'an & Panel Guru</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #1f2937 100%);
      color: #f3f4f6;
      padding: 20px;
      position: relative;
    }

    .glow-1 {
      position: absolute;
      top: 5%;
      left: 10%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.3) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      filter: blur(60px);
      z-index: 0;
    }

    .glow-2 {
      position: absolute;
      bottom: 5%;
      right: 10%;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.25) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      filter: blur(70px);
      z-index: 0;
    }

    .glass-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 35px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      transition: all 0.3s ease;
    }

    .glass-card.wide {
      max-width: 850px;
    }

    .role-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.05);
      padding: 5px;
      border-radius: 12px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: #9ca3af;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.1);
      color: #34d399;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .title {
      font-size: 1.6rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #34d399, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: #9ca3af;
    }

    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .form-group input:focus, .form-group textarea:focus {
      border-color: #a855f7;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #059669, #7c3aed);
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: 0.3s;
    }

    .btn:hover {
      opacity: 0.9;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 8px 16px;
      width: auto;
      font-size: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Admin Table & Form Layout */
    .admin-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    @media (max-width: 768px) {
      .admin-grid { grid-template-columns: 1fr; }
    }

    .student-list-box {
      max-height: 400px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      padding: 10px;
    }

    .student-item {
      padding: 12px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: 0.2s;
    }

    .student-item:hover, .student-item.selected {
      border-color: #a855f7;
      background: rgba(168, 85, 247, 0.1);
    }

    .edit-box {
      background: rgba(255, 255, 255, 0.03);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .motivation-card {
      background: rgba(168, 85, 247, 0.08);
      border: 1px dashed rgba(168, 85, 247, 0.4);
      border-radius: 14px;
      padding: 18px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <!-- KARTU LOGIN -->
  <div id="loginCard" class="glass-card">
    <div class="role-tabs">
      <button class="tab-btn active" id="tabStudent" onclick="switchRole('student')">Siswa</button>
      <button class="tab-btn" id="tabAdmin" onclick="switchRole('admin')">Guru / Admin</button>
    </div>

    <!-- FORM LOGIN SISWA -->
    <form id="studentLoginForm">
      <h2 class="title">Login Siswa</h2>
      <div class="form-group">
        <label>NISN Siswa</label>
        <input type="text" id="nisn" placeholder="Masukkan NISN" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="studentPass" placeholder="Masukkan Password" required>
      </div>
      <button type="submit" class="btn">Masuk Portal Siswa</button>
    </form>

    <!-- FORM LOGIN GURU -->
    <form id="adminLoginForm" style="display: none;">
      <h2 class="title">Panel Guru / Admin</h2>
      <div class="form-group">
        <label>PIN Admin / Guru</label>
        <input type="password" id="adminPin" placeholder="Masukkan PIN Admin" required>
      </div>
      <button type="submit" class="btn">Masuk Panel Guru</button>
    </form>

    <div id="loginError" style="color: #f87171; font-size: 0.85rem; text-align: center; margin-top: 15px;"></div>
  </div>

  <!-- DASHBOARD SISWA -->
  <div id="studentDashboard" class="glass-card wide" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <div>
        <h2 id="dispName" style="font-size: 1.4rem;">Nama Siswa</h2>
        <span id="dispMeta" style="font-size: 0.85rem; color: #9ca3af;">NISN: - | Kelas: -</span>
      </div>
      <button class="btn-logout" onclick="logout()">Keluar</button>
    </div>

    <div style="background: rgba(255,255,255,0.04); padding: 15px; border-radius: 12px; margin-bottom: 20px;">
      <span style="font-size: 0.75rem; color: #9ca3af;">📖 CAPAIAN TERAKHIR</span>
      <p id="dispCapaian" style="font-size: 1.1rem; font-weight: 600; margin-top: 5px;">-</p>
    </div>

    <div class="motivation-card" id="motivCard" style="display: none;">
      <span style="font-size: 0.8rem; color: #c084fc; font-weight: 600;">💬 PESAN & MOTIVASI GURU:</span>
      <p id="dispMotivasi" style="font-style: italic; margin-top: 8px; color: #e2e8f0;">"-"</p>
    </div>
  </div>

  <!-- PANEL DASHBOARD GURU / ADMIN -->
  <div id="adminDashboard" class="glass-card wide" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2>Panel Kelola Hafalan Siswa</h2>
      <button class="btn-logout" onclick="logout()">Keluar</button>
    </div>

    <div class="admin-grid">
      <!-- DAFTAR SISWA -->
      <div>
        <label style="font-size: 0.85rem; color: #9ca3af; display: block; margin-bottom: 8px;">Pilih Siswa:</label>
        <div class="student-list-box" id="studentList">
          <p style="text-align: center; color: #9ca3af; padding: 20px;">Memuat data siswa...</p>
        </div>
      </div>

      <!-- FORM EDIT DATA SISWA -->
      <div class="edit-box">
        <h3 id="selectedStudentTitle" style="font-size: 1.1rem; margin-bottom: 15px; color: #34d399;">Pilih siswa di sebelah kiri</h3>
        <form id="updateForm" style="display: none;">
          <input type="hidden" id="editRowIndex">
          
          <div class="form-group">
            <label>Capaian Surah Terakhir</label>
            <input type="text" id="editSurah" placeholder="Contoh: Ar-Rahman 1-10">
          </div>

          <div class="form-group">
            <label>Capaian Halaman</label>
            <input type="text" id="editHalaman" placeholder="Contoh: 11">
          </div>

          <div class="form-group">
            <label>Pesan / Motivasi Guru</label>
            <textarea id="editMotivasi" rows="4" placeholder="Tuliskan apresiasi atau motivasi untuk siswa ini..."></textarea>
          </div>

          <button type="submit" class="btn" id="saveBtn">Simpan Perubahan</button>
          <div id="updateStatus" style="font-size: 0.85rem; text-align: center; margin-top: 10px;"></div>
        </form>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "URL_WEB_APP_ANDA"; // GANTI DENGAN URL APPS SCRIPT ANDA
    let currentAdminPin = "";
    let studentDataList = [];

    function switchRole(role) {
      document.getElementById('loginError').innerText = "";
      if (role === 'student') {
        document.getElementById('tabStudent').classList.add('active');
        document.getElementById('tabAdmin').classList.remove('active');
        document.getElementById('studentLoginForm').style.display = 'block';
        document.getElementById('adminLoginForm').style.display = 'none';
      } else {
        document.getElementById('tabAdmin').classList.add('active');
        document.getElementById('tabStudent').classList.remove('active');
        document.getElementById('studentLoginForm').style.display = 'none';
        document.getElementById('adminLoginForm').style.display = 'block';
      }
    }

    // LOGIN SISWA
    document.getElementById('studentLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nisn = document.getElementById('nisn').value;
      const pass = document.getElementById('studentPass').value;
      
      try {
        const res = await fetch(`${SCRIPT_URL}?action=student_login&nisn=${encodeURIComponent(nisn)}&password=${encodeURIComponent(pass)}`);
        const result = await res.json();
        
        if (result.status === 'success') {
          showStudentDashboard(result.data);
        } else {
          document.getElementById('loginError').innerText = result.message;
        }
      } catch (err) {
        document.getElementById('loginError').innerText = "Gagal terhubung ke server.";
      }
    });

    // LOGIN GURU / ADMIN
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pin = document.getElementById('adminPin').value;
      
      try {
        const res = await fetch(`${SCRIPT_URL}?action=admin_login&pin=${encodeURIComponent(pin)}`);
        const result = await res.json();
        
        if (result.status === 'success') {
          currentAdminPin = pin;
          showAdminDashboard();
        } else {
          document.getElementById('loginError').innerText = result.message;
        }
      } catch (err) {
        document.getElementById('loginError').innerText = "Gagal terhubung ke server.";
      }
    });

    function showStudentDashboard(data) {
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('studentDashboard').style.display = 'block';

      document.getElementById('dispName').innerText = data.NAMA;
      document.getElementById('dispMeta').innerText = `NISN: ${data.NISN} | Kelas: ${data.KELAS}`;
      document.getElementById('dispCapaian').innerText = `${data.CAPAIAN_SURAT || '-'} (${data.CAPAIAN_HALAMAN || 0} Halaman)`;

      if (data.MOTIVASI_GURU && data.MOTIVASI_GURU.trim() !== "") {
        document.getElementById('dispMotivasi').innerText = `"${data.MOTIVASI_GURU}"`;
        document.getElementById('motivCard').style.display = 'block';
      } else {
        document.getElementById('motivCard').style.display = 'none';
      }
    }

    async function showAdminDashboard() {
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('adminDashboard').style.display = 'block';

      try {
        const res = await fetch(`${SCRIPT_URL}?action=get_all_students&pin=${encodeURIComponent(currentAdminPin)}`);
        const result = await res.json();

        if (result.status === 'success') {
          studentDataList = result.data;
          renderStudentList();
        }
      } catch (err) {
        alert("Gagal memuat daftar siswa.");
      }
    }

    function renderStudentList() {
      const listContainer = document.getElementById('studentList');
      listContainer.innerHTML = "";

      studentDataList.forEach((s, idx) => {
        const item = document.createElement('div');
        item.className = "student-item";
        item.innerHTML = `<strong>${s.NAMA}</strong><br><small style="color:#9ca3af;">Kelas: ${s.KELAS} | NISN: ${s.NISN}</small>`;
        item.onclick = () => selectStudentForEdit(idx);
        listContainer.appendChild(item);
      });
    }

    function selectStudentForEdit(index) {
      const s = studentDataList[index];
      document.getElementById('selectedStudentTitle').innerText = `Edit: ${s.NAMA}`;
      document.getElementById('editRowIndex').value = s.ROW_INDEX;
      document.getElementById('editSurah').value = s.CAPAIAN_SURAT || "";
      document.getElementById('editHalaman').value = s.CAPAIAN_HALAMAN || "";
      document.getElementById('editMotivasi').value = s.MOTIVASI_GURU || "";
      document.getElementById('updateForm').style.display = 'block';
    }

    // SIMPAN PERUBAHAN DARI PANEL GURU
    document.getElementById('updateForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById('saveBtn');
      const updateStatus = document.getElementById('updateStatus');

      saveBtn.disabled = true;
      saveBtn.innerText = "Menyimpan...";
      updateStatus.innerText = "";

      const payload = {
        pin: currentAdminPin,
        rowIndex: document.getElementById('editRowIndex').value,
        capaianSurah: document.getElementById('editSurah').value,
        capaianHalaman: document.getElementById('editHalaman').value,
        motivasiGuru: document.getElementById('editMotivasi').value
      };

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.status === 'success') {
          updateStatus.style.color = "#4ade80";
          updateStatus.innerText = "✓ Berhasil disimpan!";
          showAdminDashboard(); // Refresh data
        } else {
          updateStatus.style.color = "#f87171";
          updateStatus.innerText = result.message;
        }
      } catch (err) {
        updateStatus.style.color = "#f87171";
        updateStatus.innerText = "Gagal menyimpan data.";
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = "Simpan Perubahan";
      }
    });

    function logout() {
      location.reload();
    }
  </script>
</body>
</html>
