<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TahfizhQu - Portal Siswa</title>
  <style>
    :root {
      --bg-color: #12181f;
      --card-bg: #1e2630;
      --card-border: #2e3846;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --accent-yellow: #f59e0b;
      --accent-green: #10b981;
      --accent-purple: #8b5cf6;
      --danger-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    /* FORM LOGIN */
    .login-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 30px;
      border-radius: 16px;
      margin-top: 50px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .login-box h2 {
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: var(--text-sub);
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: #161d26;
      color: #fff;
      font-size: 16px;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: var(--accent-green);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-login:hover {
      opacity: 0.9;
    }

    /* DASHBOARD SISWA */
    .dashboard {
      display: none; /* Disembunyikan sebelum login */
      flex-direction: column;
      gap: 16px;
    }

    .header-user {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .user-name {
      font-size: 24px;
      font-weight: bold;
    }

    .user-meta {
      color: var(--text-sub);
      font-size: 14px;
      margin-top: 4px;
    }

    .btn-logout {
      background: #3b2027;
      color: #f87171;
      border: 1px solid #7f1d1d;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    /* CARDS */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
    }

    .card-rank {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .rank-icon {
      font-size: 32px;
    }

    .card-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .card-sub {
      color: var(--text-sub);
      font-size: 14px;
    }

    .card-pesan {
      border-left: 4px solid var(--accent-green);
      background: #162a26;
    }

    .pesan-header {
      color: var(--accent-green);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .grid-target {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .progress-bar {
      height: 8px;
      background: #2a3442;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-purple), var(--accent-green));
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-top: 8px;
    }

    .badge-tuntas {
      background: #362f1c;
      color: var(--accent-yellow);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. FORM LOGIN -->
    <div id="loginSection" class="login-box">
      <h2>TahfizhQu Login</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="inputNisn">NISN Siswa</label>
          <input type="text" id="inputNisn" placeholder="Masukkan NISN" required>
        </div>
        <div class="form-group">
          <label for="inputPassword">Password</label>
          <input type="password" id="inputPassword" placeholder="Masukkan Password" required>
        </div>
        <button type="submit" class="btn-login" id="btnLogin">Masuk</button>
      </form>
    </div>

    <!-- 2. DASHBOARD SISWA -->
    <div id="dashboardSection" class="dashboard">
      
      <!-- HEADER -->
      <div class="header-user">
        <div>
          <div class="user-name" id="displayNama">-</div>
          <div class="user-meta">NISN: <span id="displayNisn">-</span> | Kelas: <span id="displayKelas">-</span></div>
        </div>
        <button class="btn-logout" onclick="handleLogout()">Keluar</button>
      </div>

      <!-- PERINGKAT KELAS -->
      <div class="card card-rank">
        <div class="rank-icon">🎗️</div>
        <div>
          <div class="card-title">Peringkat Kelas</div>
          <div class="card-sub" id="displayPeringkat">Mengambil peringkat...</div>
        </div>
      </div>

      <!-- PESAN GURU / NOTIFIKASI -->
      <div class="card card-pesan">
        <div class="pesan-header">🔔 PESAN GURU</div>
        <div id="displayNotifikasi" style="font-size: 15px;">-</div>
      </div>

      <!-- CAPAIAN TERAKHIR -->
      <div class="card">
        <div class="card-sub" style="font-size: 12px; font-weight: bold; margin-bottom: 6px;">📖 CAPAIAN TERAKHIR</div>
        <div class="card-title" id="displayCapaian" style="font-size: 18px;">-</div>
      </div>

      <!-- TARGET PTS & PAS -->
      <div class="grid-target">
        
        <!-- TARGET PTS -->
        <div class="card">
          <div class="card-sub" style="font-size: 11px; font-weight: bold; margin-bottom: 4px;">🎯 TARGET TENGAH SEMESTER (PTS)</div>
          <div class="card-title" id="displayPts" style="font-size: 15px;">-</div>
          <div class="progress-bar">
            <div class="progress-fill" id="barPts"></div>
          </div>
          <div class="progress-info">
            <span class="badge-tuntas">Belum Tuntas</span>
            <span id="percentPts">0%</span>
          </div>
        </div>

        <!-- TARGET PAS -->
        <div class="card">
          <div class="card-sub" style="font-size: 11px; font-weight: bold; margin-bottom: 4px;">🏁 TARGET AKHIR SEMESTER (PAS)</div>
          <div class="card-title" id="displayPas" style="font-size: 15px;">-</div>
          <div class="progress-bar">
            <div class="progress-fill" id="barPas"></div>
          </div>
          <div class="progress-info">
            <span class="badge-tuntas">Belum Tuntas</span>
            <span id="percentPas">0%</span>
          </div>
        </div>

      </div>

    </div>

  </div>

  <script>
    // GANTI SAMA URL APPS SCRIPT WEB APP ANDA YANG SUDAH DI-DEPLOY RECENTLY
    const API_URL = "https://script.google.com/macros/s/AKfycbwKQptiUggQnPMGfPVMHoqyonvnMers-Km.../exec";

    const loginSection = document.getElementById("loginSection");
    const dashboardSection = document.getElementById("dashboardSection");
    const loginForm = document.getElementById("loginForm");
    const btnLogin = document.getElementById("btnLogin");

    // ==========================================
    // 1. INSIALISASI SESI SAAT HALAMAN DI-REFRESH
    // ==========================================
    document.addEventListener("DOMContentLoaded", async () => {
      const savedCredentials = localStorage.getItem("student_credentials");

      if (savedCredentials) {
        try {
          const { nisn, password } = JSON.parse(savedCredentials);
          
          // Jika ada cache data sebelumnya, tampilkan dulu agar tidak flicker/loading lama
          const cachedSession = localStorage.getItem("student_session");
          if (cachedSession) {
            renderDashboard(JSON.parse(cachedSession));
          }

          // Tetap lakukan fetch ulang ke Apps Script untuk sinkronisasi data terbaru
          await fetchAndRefreshStudentData(nisn, password);

        } catch (e) {
          console.error("Gagal memulihkan sesi:", e);
          handleLogout();
        }
      } else {
        showLoginView();
      }
    });

    // ==========================================
    // 2. LOGIKA SUBMIT LOGIN
    // ==========================================
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const nisn = document.getElementById("inputNisn").value.trim();
      const password = document.getElementById("inputPassword").value.trim();

      if (!nisn || !password) return alert("NISN dan Password wajib diisi!");

      btnLogin.innerText = "Memproses...";
      btnLogin.disabled = true;

      const success = await fetchAndRefreshStudentData(nisn, password);

      if (success) {
        // Simpan kredensial login ke localStorage jika berhasil
        localStorage.setItem("student_credentials", JSON.stringify({ nisn, password }));
      } else {
        alert("NISN atau Password Salah / Terjadi kesalahan koneksi.");
      }

      btnLogin.innerText = "Masuk";
      btnLogin.disabled = false;
    });

    // ==========================================
    // 3. AMBIL DATA SISWA DARI API
    // ==========================================
    async function fetchAndRefreshStudentData(nisn, password) {
      try {
        const url = `${API_URL}?action=student_login&nisn=${encodeURIComponent(nisn)}&password=${encodeURIComponent(password)}`;
        const response = await fetch(url);
        
        if (!response.ok) throw new Error("HTTP Status: " + response.status);

        const result = await response.json();

        if (result.status === "success") {
          // Simpan snapshot sesi ke localStorage
          localStorage.setItem("student_session", JSON.stringify(result.data));
          renderDashboard(result.data);
          return true;
        } else {
          return false;
        }
      } catch (err) {
        console.error("Fetch Error:", err);
        return false;
      }
    }

    // ==========================================
    // 4. TAMPILKAN DATA DI UI DASHBOARD
    // ==========================================
    function renderDashboard(student) {
      loginSection.style.display = "none";
      dashboardSection.style.display = "flex";

      document.getElementById("displayNama").innerText = student.NAMA || "-";
      document.getElementById("displayNisn").innerText = student.NISN || "-";
      document.getElementById("displayKelas").innerText = student.KELAS || "-";

      // Peringkat
      if (student.PERINGKAT_KELAS && student.PERINGKAT_KELAS !== "-") {
        document.getElementById("displayPeringkat").innerText = `Peringkat ${student.PERINGKAT_KELAS} dari ${student.TOTAL_SISWA_KELAS} Siswa`;
      } else {
        document.getElementById("displayPeringkat").innerText = "Peringkat belum tersedia";
      }

      // Pesan Guru
      document.getElementById("displayNotifikasi").innerText = student.NOTIFIKASI || "Belum ada pesan dari guru.";

      // Capaian Terakhir
      const cSurat = student.CAPAIAN_TERAKHIR_SURAT || "-";
      const cHalaman = student.CAPAIAN_TERAKHIR_HALAMAN || "0";
      document.getElementById("displayCapaian").innerText = `${cSurat} (${cHalaman} Halaman)`;

      // Target PTS
      const ptsSurat = student.PTS_SURAT || "-";
      const ptsHal = parseFloat(student.PTS_HALAMAN) || 0;
      document.getElementById("displayPts").innerText = `${ptsSurat}: (${ptsHal} Halaman)`;

      // Target PAS
      const pasSurat = student.PAS_SURAT || "-";
      const pasHal = parseFloat(student.PAS_HALAMAN) || 0;
      document.getElementById("displayPas").innerText = `${pasSurat}: (${pasHal} Halaman)`;

      // Persentase Progres sederhahana (Berdasarkan Target PAS)
      const currentHal = parseFloat(cHalaman) || 0;
      let pctPts = ptsHal > 0 ? Math.min(Math.round((currentHal / ptsHal) * 100), 100) : 0;
      let pctPas = pasHal > 0 ? Math.min(Math.round((currentHal / pasHal) * 100), 100) : 0;

      document.getElementById("barPts").style.width = pctPts + "%";
      document.getElementById("percentPts").innerText = pctPts + "%";

      document.getElementById("barPas").style.width = pctPas + "%";
      document.getElementById("percentPas").innerText = pctPas + "%";
    }

    // ==========================================
    // 5. PROSES LOGOUT
    // ==========================================
    function handleLogout() {
      // Hapus data dari Local Storage
      localStorage.removeItem("student_session");
      localStorage.removeItem("student_credentials");

      // Tampilkan kembali form login
      showLoginView();
    }

    function showLoginView() {
      loginSection.style.display = "block";
      dashboardSection.style.display = "none";
      loginForm.reset();
    }
  </script>
</body>
</html>
