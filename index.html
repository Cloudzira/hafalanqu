<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Hafalan & Panel Notifikasi Guru</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #1f2937 100%);
      color: #f3f4f6;
      padding: 20px;
    }

    .glass-card {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .glass-card.wide {
      max-width: 800px;
    }

    .role-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.05);
      padding: 5px;
      border-radius: 12px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: #9ca3af;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.1);
      color: #34d399;
    }

    .title {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #34d399, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: #9ca3af;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #059669, #7c3aed);
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Target & Progress Grid */
    .target-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    @media (max-width: 600px) {
      .target-grid { grid-template-columns: 1fr; }
    }

    .target-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 15px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #34d399, #a855f7);
      width: 0%;
      transition: width 0.5s ease;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: 8px;
    }

    .badge-success { background: rgba(52, 211, 153, 0.2); color: #34d399; }
    .badge-warning { background: rgba(251, 191, 36, 0.2); color: #fbbf24; }

    /* Layout Panel Guru */
    .admin-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 20px;
      margin-top: 20px;
    }

    @media (max-width: 600px) {
      .admin-grid { grid-template-columns: 1fr; }
    }

    .student-list-box {
      max-height: 350px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      padding: 10px;
    }

    .student-item {
      padding: 10px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .student-item:hover, .student-item.selected {
      background: rgba(168, 85, 247, 0.25);
      border: 1px solid rgba(168, 85, 247, 0.4);
    }

    .edit-box {
      background: rgba(255, 255, 255, 0.03);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Notifikasi Box Siswa */
    .notif-box {
      background: rgba(52, 211, 153, 0.08);
      border: 1px solid rgba(52, 211, 153, 0.3);
      border-left: 4px solid #34d399;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <!-- CARD LOGIN -->
  <div id="loginCard" class="glass-card">
    <div class="role-tabs">
      <button class="tab-btn active" id="tabStudent" onclick="switchRole('student')">Siswa</button>
      <button class="tab-btn" id="tabAdmin" onclick="switchRole('admin')">Guru / Admin</button>
    </div>

    <!-- FORM LOGIN SISWA -->
    <form id="studentLoginForm">
      <h2 class="title">Login Siswa</h2>
      <div class="form-group">
        <label>NISN Siswa</label>
        <input type="text" id="nisn" placeholder="Masukkan NISN" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="studentPass" placeholder="Masukkan Password" required>
      </div>
      <button type="submit" class="btn">Masuk Portal Siswa</button>
    </form>

    <!-- FORM LOGIN GURU -->
    <form id="adminLoginForm" style="display: none;">
      <h2 class="title">Panel Guru</h2>
      <div class="form-group">
        <label>PIN Guru / Admin</label>
        <input type="password" id="adminPin" placeholder="Masukkan PIN Admin" required>
      </div>
      <button type="submit" class="btn">Masuk Panel Guru</button>
    </form>

    <div id="loginError" style="color: #f87171; font-size: 0.85rem; text-align: center; margin-top: 15px;"></div>
  </div>

  <!-- DASHBOARD SISWA -->
  <div id="studentDashboard" class="glass-card wide" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <div>
        <h2 id="dispName">Nama Siswa</h2>
        <span id="dispMeta" style="font-size: 0.85rem; color: #9ca3af;">NISN: - | Kelas: -</span>
      </div>
      <button class="btn-logout" onclick="logout()">Keluar</button>
    </div>

    <!-- BOX NOTIFIKASI DARI GURU -->
    <div id="notifCard" class="notif-box" style="display: none;">
      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
        <span style="font-size: 1.1rem;">🔔</span>
        <span style="font-size: 0.85rem; color: #34d399; font-weight: 700;">NOTIFIKASI DARI GURU</span>
      </div>
      <p id="dispNotifikasi" style="font-size: 0.95rem; color: #f3f4f6; line-height: 1.4;">-</p>
    </div>

    <!-- CAPAIAN TERAKHIR -->
    <div style="background: rgba(255,255,255,0.04); padding: 15px; border-radius: 12px; margin-bottom: 20px;">
      <span style="font-size: 0.75rem; color: #9ca3af;">📖 CAPAIAN TERAKHIR</span>
      <p id="dispCapaian" style="font-size: 1.1rem; font-weight: 600; margin-top: 5px;">-</p>
    </div>

    <!-- GRID TARGET PTS & PAS -->
    <div class="target-grid">
      <!-- TARGET PTS -->
      <div class="target-box">
        <span style="font-size: 0.75rem; color: #9ca3af;">🎯 TARGET TENGAH SEMESTER (PTS)</span>
        <p id="dispTargetPTS" style="font-size: 0.95rem; font-weight: 600; margin-top: 5px;">-</p>
        <div class="progress-bar-bg">
          <div id="barPTS" class="progress-bar-fill"></div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
          <span id="badgePTS" class="badge badge-warning">Belum Tuntas</span>
          <span id="percentPTS" style="font-size: 0.75rem; color: #9ca3af;">0%</span>
        </div>
      </div>

      <!-- TARGET PAS -->
      <div class="target-box">
        <span style="font-size: 0.75rem; color: #9ca3af;">🏁 TARGET AKHIR SEMESTER (PAS)</span>
        <p id="dispTargetPAS" style="font-size: 0.95rem; font-weight: 600; margin-top: 5px;">-</p>
        <div class="progress-bar-bg">
          <div id="barPAS" class="progress-bar-fill"></div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
          <span id="badgePAS" class="badge badge-warning">Belum Tuntas</span>
          <span id="percentPAS" style="font-size: 0.75rem; color: #9ca3af;">0%</span>
        </div>
      </div>
    </div>
  </div>

  <!-- DASHBOARD GURU -->
  <div id="adminDashboard" class="glass-card wide" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2>Panel Kirim Notifikasi Siswa</h2>
      <button class="btn-logout" onclick="logout()">Keluar</button>
    </div>

    <div class="admin-grid">
      <div>
        <label style="font-size: 0.85rem; color: #9ca3af; display: block; margin-bottom: 8px;">Pilih Siswa:</label>
        <div class="student-list-box" id="studentList"></div>
      </div>

      <div class="edit-box">
        <h3 id="selectedStudentTitle" style="font-size: 1rem; margin-bottom: 15px; color: #34d399;">← Pilih siswa di samping</h3>
        <form id="updateForm" style="display: none;">
          <input type="hidden" id="editRowIndex">
          
          <div class="form-group">
            <label>Pesan Notifikasi untuk Siswa</label>
            <textarea id="editNotifikasi" rows="5" placeholder="Tulis pesan, evaluasi hafalan, atau pengumuman khusus siswa ini di sini..." required></textarea>
          </div>

          <button type="submit" class="btn" id="saveBtn">Kirim Notifikasi</button>
          <div id="updateStatus" style="font-size: 0.85rem; text-align: center; margin-top: 10px;"></div>
        </form>
      </div>
    </div>
  </div>

  <script>
    // PASTEKAN URL WEB APP APPS SCRIPT ANDA DI SINI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyfx3TznSAb2yvJohvDYUDqM9NAD412TvrSpFkLc_07HokOjttn_Pp-EFk6U3NSau6Y/exec"; 

    let currentAdminPin = "";
    let studentDataList = [];

    function switchRole(role) {
      document.getElementById('loginError').innerText = "";
      if (role === 'student') {
        document.getElementById('tabStudent').classList.add('active');
        document.getElementById('tabAdmin').classList.remove('active');
        document.getElementById('studentLoginForm').style.display = 'block';
        document.getElementById('adminLoginForm').style.display = 'none';
      } else {
        document.getElementById('tabAdmin').classList.add('active');
        document.getElementById('tabStudent').classList.remove('active');
        document.getElementById('studentLoginForm').style.display = 'none';
        document.getElementById('adminLoginForm').style.display = 'block';
      }
    }

    // LOGIN SISWA
    document.getElementById('studentLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nisn = document.getElementById('nisn').value;
      const pass = document.getElementById('studentPass').value;
      
      try {
        const res = await fetch(`${SCRIPT_URL}?action=student_login&nisn=${encodeURIComponent(nisn)}&password=${encodeURIComponent(pass)}`);
        const result = await res.json();
        
        if (result.status === 'success') {
          showStudentDashboard(result.data);
        } else {
          document.getElementById('loginError').innerText = result.message || "NISN atau Password salah.";
        }
      } catch (err) {
        document.getElementById('loginError').innerText = "Gagal terhubung ke server.";
      }
    });

    // LOGIN GURU
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pin = document.getElementById('adminPin').value;
      
      try {
        const res = await fetch(`${SCRIPT_URL}?action=admin_login&pin=${encodeURIComponent(pin)}`);
        const result = await res.json();
        
        if (result.status === 'success') {
          currentAdminPin = pin;
          showAdminDashboard();
        } else {
          document.getElementById('loginError').innerText = result.message || "PIN Guru salah.";
        }
      } catch (err) {
        document.getElementById('loginError').innerText = "Gagal terhubung ke server.";
      }
    });

    function parseHalaman(val) {
      if (!val) return 0;
      return parseFloat(String(val).replace(',', '.')) || 0;
    }

    function updateProgress(badgeId, barId, percentId, currentVal, targetVal) {
      const badge = document.getElementById(badgeId);
      const bar = document.getElementById(barId);
      const percent = document.getElementById(percentId);

      if (!targetVal || targetVal <= 0) {
        bar.style.width = '0%';
        percent.innerText = '0%';
        badge.innerText = 'Belum Tuntas';
        badge.className = 'badge badge-warning';
        return;
      }

      let percentage = Math.min(Math.round((currentVal / targetVal) * 100), 100);
      bar.style.width = percentage + '%';
      percent.innerText = percentage + '%';

      if (currentVal >= targetVal) {
        badge.innerText = 'Tuntas';
        badge.className = 'badge badge-success';
      } else {
        badge.innerText = 'Belum Tuntas';
        badge.className = 'badge badge-warning';
      }
    }

    // FUNGSI DASHBOARD SISWA (SUDAH DIPERBAIKI)
    function showStudentDashboard(data) {
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('studentDashboard').style.display = 'block';

      // Meta Data
      document.getElementById('dispName').innerText = data.NAMA || "Siswa";
      document.getElementById('dispMeta').innerText = `NISN: ${data.NISN || '-'} | Kelas: ${data.KELAS || '-'}`;

      // Tampilkan Notifikasi dari Guru jika ada
      const notifCard = document.getElementById('notifCard');
      const pesanNotif = data.NOTIFIKASI || data.PESAN_GURU || data.MOTIVASI_GURU;
      if (pesanNotif && pesanNotif.trim() !== "") {
        document.getElementById('dispNotifikasi').innerText = pesanNotif.trim();
        notifCard.style.display = 'block';
      } else {
        notifCard.style.display = 'none';
      }

      // Capaian Terakhir
      const capaianSurat = data.CAPAIAN_TERAKHIR_SURAT || '-';
      const capaianHlm = parseHalaman(data.CAPAIAN_TERAKHIR_HALAMAN);
      document.getElementById('dispCapaian').innerText = `${capaianSurat} (${capaianHlm} Halaman)`;

      // Target PTS
      const targetPtsSurah = data.PTS_SURAT || "-";
      const targetPtsHlm = parseHalaman(data.PTS_HALAMAN);
      document.getElementById('dispTargetPTS').innerText = `${targetPtsSurah} (${targetPtsHlm} Halaman)`;
      updateProgress('badgePTS', 'barPTS', 'percentPTS', capaianHlm, targetPtsHlm);

      // Target PAS
      const targetPasSurah = data.PAS_SURAT || "-";
      const targetPasHlm = parseHalaman(data.PAS_HALAMAN);
      document.getElementById('dispTargetPAS').innerText = `${targetPasSurah} (${targetPasHlm} Halaman)`;
      updateProgress('badgePAS', 'barPAS', 'percentPAS', capaianHlm, targetPasHlm);
    }

    async function showAdminDashboard() {
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('adminDashboard').style.display = 'block';

      try {
        const res = await fetch(`${SCRIPT_URL}?action=get_all_students&pin=${encodeURIComponent(currentAdminPin)}`);
        const result = await res.json();

        if (result.status === 'success') {
          studentDataList = result.data;
          renderStudentList();
        } else {
          alert("Gagal memuat data siswa: " + result.message);
        }
      } catch (err) {
        alert("Gagal memuat daftar siswa. Periksa jaringan Anda.");
      }
    }

    function renderStudentList() {
      const listContainer = document.getElementById('studentList');
      listContainer.innerHTML = "";

      if (!studentDataList || studentDataList.length === 0) {
        listContainer.innerHTML = "<p style='color:#9ca3af; font-size:0.85rem; text-align:center;'>Tidak ada data siswa.</p>";
        return;
      }

      studentDataList.forEach((s, idx) => {
        const item = document.createElement('div');
        item.className = "student-item";
        item.id = `student-item-${idx}`;
        item.innerHTML = `<strong>${s.NAMA}</strong><br><small style="color:#9ca3af;">${s.KELAS || ''} | NISN: ${s.NISN}</small>`;
        item.onclick = () => selectStudentForEdit(idx);
        listContainer.appendChild(item);
      });
    }

    function selectStudentForEdit(index) {
      document.querySelectorAll('.student-item').forEach(el => el.classList.remove('selected'));
      document.getElementById(`student-item-${index}`).classList.add('selected');

      const s = studentDataList[index];
      document.getElementById('selectedStudentTitle').innerText = `Kirim Notifikasi ke: ${s.NAMA}`;
      document.getElementById('editRowIndex').value = s.ROW_INDEX;
      document.getElementById('editNotifikasi').value = s.NOTIFIKASI || s.PESAN_GURU || s.MOTIVASI_GURU || "";
      document.getElementById('updateForm').style.display = 'block';
    }

    // SIMPAN / KIRIM NOTIFIKASI
    document.getElementById('updateForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById('saveBtn');
      const updateStatus = document.getElementById('updateStatus');

      saveBtn.disabled = true;
      saveBtn.innerText = "Mengirim...";
      updateStatus.innerText = "";

      const payload = {
        action: "update_notif",
        pin: currentAdminPin,
        rowIndex: document.getElementById('editRowIndex').value,
        notifikasi: document.getElementById('editNotifikasi').value
      };

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.status === 'success') {
          updateStatus.style.color = "#4ade80";
          updateStatus.innerText = "✓ Notifikasi berhasil dikirim!";
          
          // Update data lokal
          const rIndex = document.getElementById('editRowIndex').value;
          const studentObj = studentDataList.find(s => s.ROW_INDEX == rIndex);
          if (studentObj) {
            studentObj.NOTIFIKASI = payload.notifikasi;
          }
        } else {
          updateStatus.style.color = "#f87171";
          updateStatus.innerText = result.message || "Gagal mengirim notifikasi.";
        }
      } catch (err) {
        updateStatus.style.color = "#f87171";
        updateStatus.innerText = "Gagal menyimpan data. Pastikan koneksi aman.";
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = "Kirim Notifikasi";
      }
    });

    function logout() {
      location.reload();
    }
  </script>
</body>
</html>
