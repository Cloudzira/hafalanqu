<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Data - Glassmorphism</title>
  <style>
    /* Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      color: #f8fafc;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Decorative Background Glow Spheres */
    .glow-1 {
      position: absolute;
      top: 10%;
      left: 15%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.4) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      z-index: 0;
      filter: blur(50px);
    }

    .glow-2 {
      position: absolute;
      bottom: 10%;
      right: 15%;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.35) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      z-index: 0;
      filter: blur(60px);
    }

    /* Container Glassmorphism */
    .glass-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1000px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.125);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    /* Header Title */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .header h2 {
      font-size: 1.8rem;
      font-weight: 600;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    /* Status Indicator & Reload Button */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-refresh {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.3s ease;
    }

    .btn-refresh:hover {
      background: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    /* Table Wrapper (Responsive Scroll) */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      border-radius: 12px;
    }

    /* Glassmorphism Table */
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 1px;
      padding: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    td {
      padding: 16px;
      font-size: 0.95rem;
      color: #e2e8f0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: background 0.2s ease;
    }

    tbody tr {
      transition: all 0.2s ease;
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    /* Loading state Spinner & Text */
    .loading-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px 0;
      color: #94a3b8;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid #818cf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Accent Glow Spheres -->
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <!-- Main Glass Container -->
  <div class="glass-container">
    <div class="header">
      <h2>Data Spreadsheet</h2>
      <div class="header-actions">
        <button class="btn-refresh" onclick="fetchData()">Refresh</button>
      </div>
    </div>

    <div id="loading" class="loading-box">
      <div class="spinner"></div>
      <p>Mengambil data terbaru...</p>
    </div>

    <div class="table-responsive">
      <table id="dataTable" style="display: none;">
        <thead id="tableHeader"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    // MASUKKAN URL GOOGLE APPS SCRIPT WEB APP ANDA DI SINI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzMsqZ-kW6h9BrDTE01wB2fDFUeJ165-PZaAA8oeAl1FH9TX2OOoLCrAExy50AcI5l-/exec";

    async function fetchData() {
      const loadingEl = document.getElementById('loading');
      const tableEl = document.getElementById('dataTable');

      // Tampilkan kembali loading saat me-refresh
      loadingEl.style.display = 'flex';
      tableEl.style.display = 'none';

      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();

        if (data.length > 0) {
          loadingEl.style.display = 'none';
          tableEl.style.display = 'table';

          // Render Header Tabel (Baris Pertama Spreadsheet)
          const headerRow = data[0];
          const thead = document.getElementById('tableHeader');
          let headerHTML = '<tr>';
          headerRow.forEach(header => {
            headerHTML += `<th>${header}</th>`;
          });
          headerHTML += '</tr>';
          thead.innerHTML = headerHTML;

          // Render Isi Tabel (Baris Selanjutnya)
          const tbody = document.getElementById('tableBody');
          let bodyHTML = '';
          for (let i = 1; i < data.length; i++) {
            bodyHTML += '<tr>';
            data[i].forEach(cell => {
              bodyHTML += `<td>${cell}</td>`;
            });
            bodyHTML += '</tr>';
          }
          tbody.innerHTML = bodyHTML;
        } else {
          loadingEl.innerHTML = '<p>Data kosong pada spreadsheet.</p>';
        }
      } catch (error) {
        console.error('Error fetching data:', error);
        loadingEl.innerHTML = '<p style="color: #f87171;">Gagal mengambil data. Pastikan URL Web App sudah benar dan akses dideploy ke "Anyone".</p>';
      }
    }

    // Jalankan otomatis saat halaman dibuka
    fetchData();
  </script>
</body>
</html>
