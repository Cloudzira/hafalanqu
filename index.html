<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capaian Hafalan Kelas XII</title>
  
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      /* Palette Dark Glassmorphism Modern & Soft */
      --bg-gradient: radial-gradient(circle at 50% 0%, #111827 0%, #0b0f19 100%);
      
      --neon-green: #10b981;  /* Soft Emerald Green */
      --neon-blue: #3b82f6;   /* Soft Royal Blue */
      --neon-purple: #8b5cf6; /* Soft Violet Purple */
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      --card-bg: rgba(17, 24, 39, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      
      --shadow-neon: 0 10px 30px -10px rgba(59, 130, 246, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }

    /* Soft Ambient Glowing Orbs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(140px);
      z-index: -1;
      opacity: 0.25;
    }

    body::before {
      width: 350px;
      height: 350px;
      background: var(--neon-purple);
      top: -5%;
      left: 10%;
    }

    body::after {
      width: 400px;
      height: 400px;
      background: var(--neon-blue);
      bottom: -5%;
      right: 10%;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    /* Header Styling */
    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .header .subtitle {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--neon-green);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .header h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header-divider {
      width: 70px;
      height: 3px;
      background: linear-gradient(90deg, var(--neon-green), var(--neon-blue), var(--neon-purple));
      margin: 0 auto;
      border-radius: 3px;
    }

    /* Portal Class Input Box */
    .login-box {
      max-width: 420px;
      margin: 0 auto;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 35px 30px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), var(--shadow-neon);
      text-align: center;
    }

    .login-box i.icon-header {
      font-size: 2.5rem;
      background: linear-gradient(135deg, var(--neon-green), var(--neon-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 15px;
    }

    .login-box h2 {
      font-size: 1.35rem;
      margin-bottom: 8px;
      color: #fff;
      font-weight: 700;
    }

    .login-box p {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--neon-green);
      margin-bottom: 8px;
    }

    .input-group select {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-main);
      transition: all 0.3s ease;
      font-family: inherit;
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22293.4%22%20height%3D%22293.4%22%3E%3Cpath%20fill%3D%22%2310b981%22%20d%3D%22M236.4%20129.3L146.7%20219%2057%20129.3c-6.2-6.2-16.4-6.2-22.6%200-6.2%206.2-6.2%2016.4%200%2022.6l101%20101c3.1%203.1%207.2%204.7%2011.3%204.7s8.2-1.6%2011.3-4.7l101-101c6.2-6.2%206.2-16.4%200-22.6-6.3-6.2-16.4-6.2-22.6%200z%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 16px center;
      background-size: 12px;
    }

    .input-group select:focus {
      border-color: var(--neon-blue);
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
    }

    .input-group select option {
      background: #0f172a;
      color: #f8fafc;
      padding: 10px;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(16, 185, 129, 0.4);
    }

    /* Dashboard Section */
    .dashboard {
      display: none;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 16px 24px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-neon);
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .class-badge {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .class-badge h2 {
      font-size: 1.25rem;
      color: #fff;
      font-weight: 700;
    }

    .btn-change {
      background: rgba(255, 255, 255, 0.05);
      color: var(--neon-green);
      border: 1px solid var(--neon-green);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .btn-change:hover {
      background: var(--neon-green);
      color: #0b0f19;
      box-shadow: 0 0 12px var(--neon-green);
    }

    .search-box {
      position: relative;
      flex: 1;
      max-width: 320px;
    }

    .search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--neon-blue);
      font-size: 0.9rem;
    }

    .search-box input {
      width: 100%;
      padding: 9px 14px 9px 38px;
      border: 1px solid var(--card-border);
      border-radius: 25px;
      outline: none;
      font-size: 0.88rem;
      background: rgba(15, 23, 42, 0.8);
      color: var(--text-main);
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .search-box input:focus {
      border-color: var(--neon-blue);
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
    }

    /* Loading Spinner */
    .loading {
      text-align: center;
      padding: 50px 0;
      display: none;
    }

    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 3px solid rgba(16, 185, 129, 0.1);
      border-radius: 50%;
      border-top-color: var(--neon-green);
      animation: spin 1s infinite linear;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Table Layout */
    .table-container {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 16px;
      border: 1px solid var(--card-border);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      overflow-x: auto;
    }

    .student-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    .student-table th {
      background: rgba(15, 23, 42, 0.8);
      padding: 14px 18px;
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--card-border);
      white-space: nowrap;
    }

    .student-table th.col-no { width: 80px; text-align: center; }
    .student-table th.col-nama { width: 45%; }
    .student-table th.col-capaian { width: 45%; }

    .student-table td {
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      vertical-align: middle;
      transition: background 0.2s ease;
    }

    .student-table tbody tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }

    .student-table tbody tr:last-child td {
      border-bottom: none;
    }

    .td-no {
      text-align: center;
    }

    .no-badge {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--neon-blue);
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.25);
      padding: 2px 8px;
      border-radius: 8px;
    }

    .student-name {
      font-weight: 600;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.12);
      color: var(--neon-green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      border: 1px solid rgba(16, 185, 129, 0.25);
      flex-shrink: 0;
    }

    .capaian-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      color: var(--text-main);
    }

    .capaian-tag i.fa-star { color: var(--neon-purple); }

    .no-results {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .top-bar { flex-direction: column; align-items: stretch; }
      .search-box { max-width: 100%; }
      .student-table th, .student-table td { padding: 12px 10px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. Form Masuk Kelas -->
    <div id="loginSection">
      <header class="header">
        <div class="subtitle">Laporan Capaian Hafalan Kelas XII</div>
        <h1>PROGRES HAFALAN</h1>
        <div class="header-divider"></div>
      </header>

      <div class="login-box">
        <i class="fa-solid fa-graduation-cap icon-header"></i>
        <h2>PILIH KELAS</h2>
        <p>Pilih kelas Anda untuk melihat laporan</p>
        
        <form onsubmit="handleClassSubmit(event)">
          <div class="input-group">
            <label for="kelasSelect">NAMA KELAS</label>
            <select id="kelasSelect" required>
              <option value="" disabled selected>-- Pilih Kelas --</option>
              <option value="XII A">XII A</option>
              <option value="XII B">XII B</option>
              <option value="XII C">XII C</option>
              <option value="XII D">XII D</option>
              <option value="XII E">XII E</option>
              <option value="XII F">XII F</option>
              <option value="XII G">XII G</option>
              <option value="XII H">XII H</option>
            </select>
          </div>
          <button type="submit" class="btn-submit">
            <i class="fa-solid fa-arrow-right-to-bracket" style="margin-right: 8px;"></i> Buka Progres Hafalan
          </button>
        </form>
      </div>
    </div>

    <!-- 2. Section Dashboard Data -->
    <div id="dashboardSection" class="dashboard">
      <header class="header">
        <div class="subtitle">Laporan Capaian Hafalan Kelas XII</div>
        <h1>PROGRES HAFALAN</h1>
        <div class="header-divider"></div>
      </header>

      <!-- Top Bar / Controls -->
      <div class="top-bar">
        <div class="class-badge">
          <h2 id="displayClassName">Kelas ...</h2>
          <button class="btn-change" onclick="resetClassSelection()">
            <i class="fa-solid fa-rotate-left"></i> Ganti Kelas
          </button>
        </div>

        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="Cari nama..." onkeyup="filterData()">
        </div>
      </div>

      <!-- Loading State -->
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <p style="margin-top: 15px; color: var(--text-muted); font-size: 0.88rem;">Mengambil data kelas...</p>
      </div>

      <!-- Table Container -->
      <div id="tableContainer" class="table-container">
        <table class="student-table">
          <thead>
            <tr>
              <th class="col-no">No</th>
              <th class="col-nama">Nama Siswa</th>
              <th class="col-capaian">Capaian Akhir</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Data baris siswa akan dimasukkan melalui JS -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyITqk9x-1tGV0rHApjIAun-ZujrNCJ7V2rQyBGuSzfT_7o0yzUXjvi0nqDYu7TLdhABA/exec";

    let currentClass = "";
    let allData = [];

    function handleClassSubmit(e) {
      e.preventDefault();
      const selectVal = document.getElementById('kelasSelect').value;
      if (!selectVal) return;

      currentClass = selectVal;
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('dashboardSection').style.display = 'block';
      document.getElementById('displayClassName').innerText = "Kelas " + currentClass;

      fetchClassDataJSONP(currentClass);
    }

    function resetClassSelection() {
      document.getElementById('dashboardSection').style.display = 'none';
      document.getElementById('loginSection').style.display = 'block';
      document.getElementById('tableBody').innerHTML = '';
      document.getElementById('searchInput').value = '';
      document.getElementById('kelasSelect').value = '';
      allData = [];
    }

    function fetchClassDataJSONP(namaKelas) {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('tableContainer').style.display = 'none';

      const callbackName = 'jsonp_callback_' + Math.round(100000 * Math.random());
      
      window[callbackName] = function(response) {
        delete window[callbackName];
        if (script.parentNode) {
          document.body.removeChild(script);
        }

        if (response && response.error) {
          showError(response.error);
        } else {
          renderTable(response.data || []);
        }
      };

      const script = document.createElement('script');
      script.src = `${SCRIPT_URL}?kelas=${encodeURIComponent(namaKelas)}&callback=${callbackName}`;
      
      script.onerror = function() {
        delete window[callbackName];
        if (script.parentNode) {
          document.body.removeChild(script);
        }
        showError("Gagal terhubung ke server. Pastikan nama kelas benar.");
      };

      document.body.appendChild(script);
    }

    function renderTable(data) {
      allData = data;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('tableContainer').style.display = 'block';
      
      displayFilteredData(allData);
    }

    function displayFilteredData(data) {
      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = '';

      if (!data || data.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="3">
              <div class="no-results">
                <i class="fa-regular fa-folder-open" style="font-size: 2rem; margin-bottom: 10px; color: var(--neon-green);"></i>
                <p>Tidak ada data siswa untuk kelas ini.</p>
              </div>
            </td>
          </tr>`;
        return;
      }

      data.forEach(item => {
        const initial = item.nama ? item.nama.charAt(0).toUpperCase() : '?';

        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="td-no">
            <span class="no-badge">${item.no || '-'}</span>
          </td>
          <td>
            <div class="student-name">
              <div class="avatar">${initial}</div>
              <span>${item.nama || '-'}</span>
            </div>
          </td>
          <td>
            <div class="capaian-tag">
              <i class="fa-solid fa-star"></i>
              <span>${item.capaianAkhir || '-'}</span>
            </div>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    function filterData() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allData.filter(item => 
        item.nama && item.nama.toString().toLowerCase().includes(query)
      );
      displayFilteredData(filtered);
    }

    function showError(message) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('tableContainer').style.display = 'block';
      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = `
        <tr>
          <td colspan="3">
            <div style="text-align: center; color: #f87171; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); padding: 18px; border-radius: 12px; margin: 20px;">
              <i class="fa-solid fa-triangle-exclamation" style="font-size: 1.2rem; margin-bottom: 6px;"></i>
              <p style="font-weight: 600; font-size: 0.9rem;">${message}</p>
            </div>
          </td>
        </tr>
      `;
    }
  </script>
</body>
</html>
